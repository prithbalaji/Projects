<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pac-Man</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <h1>PAC-MAN</h1>
      <div class="stats"><span>Level <strong id="level">1</strong></span><span>Score <strong id="score">0</strong></span><span>Lives <strong id="lives">3</strong></span></div>
    </header>
    <canvas id="game" width="560" height="620" aria-label="Pac-Man game"></canvas>
    <p id="message">Use the arrow keys or WASD to move</p>
    <button id="restart" type="button">Restart</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
