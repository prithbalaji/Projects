<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f"><title>Net Worth Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">N</span><span>Net<span class="brand-accent">Worth</span></span></div>
      <div></div>
      <button class="icon-button" id="themeButton" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg></button>
    </header>

    <section>
      <div class="networth-heading"><div><p class="eyebrow">YOUR FINANCIAL PICTURE</p><h1>Net worth <span>dashboard.</span></h1></div><button class="primary-small" id="addItemButton"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Add account</button></div>
      <div class="stat-grid">
        <article class="stat-card featured"><div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M3 17 9 11l4 4 8-9M15 6h6v6"/></svg></div><p>Total net worth</p><strong id="netWorthValue">$0.00</strong><span>Your financial position</span></article>
        <article class="stat-card"><div class="stat-icon assets"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4zM8 7V5h8v2M4 11h16"/></svg></div><p>Total assets</p><strong id="assetsValue">$0.00</strong><span id="assetsCount">0 accounts</span></article>
        <article class="stat-card"><div class="stat-icon liabilities"><svg viewBox="0 0 24 24"><path d="M5 3h14v18H5zM8 7h8M8 11h8M8 15h5"/></svg></div><p>Total liabilities</p><strong id="liabilitiesValue">$0.00</strong><span id="liabilitiesCount">0 accounts</span></article>
      </div>
      <div class="dashboard-grid">
        <article class="dashboard-card accounts-card"><div class="card-heading"><div><p class="eyebrow">ACCOUNTS</p><h2>Your balances</h2></div><select id="accountFilter"><option value="all">All accounts</option><option value="asset">Assets</option><option value="liability">Liabilities</option></select></div><div class="account-list" id="accountList"></div></article>
        <article class="dashboard-card breakdown-card"><div class="card-heading"><div><p class="eyebrow">BREAKDOWN</p><h2>By type</h2></div></div><div class="donut-wrap"><div class="donut" id="donutChart"><div><strong id="donutNetWorth">$0</strong><span>Net worth</span></div></div></div><div class="legend" id="breakdownLegend"></div></article>
      </div>
    </section>
  </main>

  <dialog id="accountDialog"><form method="dialog" id="accountForm"><div class="dialog-heading"><div><p class="eyebrow">NEW ACCOUNT</p><h2>Add a balance</h2></div><button type="button" class="icon-button" id="closeDialog" aria-label="Close">×</button></div>
    <label>Account name<input id="accountName" required placeholder="Example: Chase Checking"></label>
    <div class="form-grid"><label>Type<select id="accountType"><option value="asset">Asset</option><option value="liability">Liability</option></select></label><label>Category<select id="accountCategory"><option>Cash</option><option>Investments</option><option>Real Estate</option><option>Vehicle</option><option>Retirement</option><option>Credit Card</option><option>Loan</option><option>Other</option></select></label></div>
    <label>Balance<input id="accountBalance" type="number" required min="0" step="0.01" placeholder="0.00"></label><button type="submit" class="translate-button full-button">Save account</button>
  </form></dialog>
  <div class="toast" id="toast" role="status"></div><script src="app.js"></script>
</body>
</html>
