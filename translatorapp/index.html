<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>Lingua — Translator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <main class="app-shell">
    <header class="topbar">
      <button class="brand" aria-label="Lingua Translator"><span class="brand-mark">L</span><span>Lingua<span class="brand-accent">Net</span></span></button>
      <div></div>
      <button class="icon-button" id="themeButton" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      </button>
    </header>

    <section class="hero-copy"><p class="eyebrow">BREAK EVERY LANGUAGE BARRIER</p><h1>Translate the world,<br><span>instantly.</span></h1></section>

    <section class="translator-card">
      <div class="language-row">
        <div class="select-wrap"><label for="sourceLanguage">From</label><select id="sourceLanguage"></select></div>
        <button class="swap-button" id="swapButton" aria-label="Swap languages"><svg viewBox="0 0 24 24"><path d="m7 7 3-3 3 3M10 4v12m7 1-3 3-3-3m3 3V8"/></svg></button>
        <div class="select-wrap align-right"><label for="targetLanguage">To</label><select id="targetLanguage"></select></div>
      </div>
      <div class="translation-grid">
        <div class="text-panel">
          <textarea id="sourceText" maxlength="5000" placeholder="Type or paste text..." aria-label="Text to translate"></textarea>
          <div class="panel-footer"><button class="text-action" id="clearButton">Clear</button><span id="characterCount">0 / 5,000</span></div>
        </div>
        <div class="text-panel output-panel">
          <textarea id="targetText" placeholder="Translation appears here" readonly aria-label="Translated text"></textarea>
          <div class="panel-footer"><button class="copy-button" id="copyButton">Copy</button></div>
        </div>
      </div>
      <div class="translate-footer"><span class="api-status" id="apiStatus"><i></i> Ready</span><button class="translate-button" id="translateButton">Translate <svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
