<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Receipt Scanner</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p>SMART FINANCE</p><h1>Receipt <span>Scanner</span></h1></div><label class="scan"><input id="photo" type="file" accept="image/*" capture="environment"><b>＋ Scan receipt</b></label></header><section class="layout"><article class="preview"><div id="drop"><span>Receipt preview</span><img id="image"><p id="placeholder">Upload a clear photo of a receipt</p></div></article><article class="details"><p class="eyebrow">EXTRACTED DETAILS</p><label>Merchant<input id="merchant" placeholder="Merchant name"></label><div class="row"><label>Date<input id="date" type="date"></label><label>Amount<input id="amount" type="number" step=".01" placeholder="0.00"></label></div><label>Category<select id="category"><option>Groceries</option><option>Dining</option><option>Transport</option><option>Shopping</option><option>Health</option><option>Other</option></select></label><button id="save">Save expense</button></article></section><section class="panel"><h2>Recent receipts</h2><div id="list"></div></section></main><div id="toast"></div><script src="app.js"></script></body></html>
