<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Expiry</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">DOCUMENT VAULT</p><h1>Expiry <span>Tracker</span></h1></div><button id="addBtn">+ Add document</button></header><section class="stats"><article><p>All documents</p><strong id="total">0</strong></article><article class="urgent"><p>Expiring soon</p><strong id="soon">0</strong></article><article><p>Expired</p><strong id="expired">0</strong></article></section><section class="panel"><div class="toolbar"><h2>Your documents</h2><select id="filter"><option value="all">All</option><option value="expired">Expired</option><option value="urgent">Next 90 days</option><option value="valid">Valid</option></select></div><div id="list"></div></section></main><dialog id="dialog"><form id="form"><h2>Add document</h2><label>Name<input id="name" required placeholder="Passport"></label><label>Category<select id="category"><option>Passport</option><option>License</option><option>Warranty</option><option>Insurance</option><option>Visa</option><option>Other</option></select></label><label>Expiry date<input id="date" type="date" required></label><label>Reminder days<input id="days" type="number" value="30" min="0"></label><button type="submit">Save document</button></form></dialog><script src="app.js"></script></body></html>
