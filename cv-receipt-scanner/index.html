<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Vision Receipt</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p>COMPUTER VISION</p><h1>Vision <span>Receipt</span></h1></div><label class="upload">＋ Upload image<input id="photo" type="file" accept="image/*"></label></header><section class="workspace"><article class="scan-panel"><div class="scan-stage"><img id="image"><div id="empty"><div class="scan-icon">⌗</div><b>Scan a receipt</b><small>JPG or PNG · best in good light</small></div><div id="corners"></div></div><div class="tools"><button id="grayscale">Grayscale</button><button id="contrast">Increase contrast</button><button id="rotate">Rotate</button></div></article><article class="result-panel"><p class="eyebrow">OCR RESULT</p><div id="status" class="status">Waiting for image</div><label>Merchant<input id="merchant"></label><label>Transaction date<input id="date" type="date"></label><label>Total amount<input id="total" type="number" step=".01"></label><label>Confidence<div class="confidence"><i id="confidenceBar"></i></div><small id="confidenceText">0%</small></label><button id="save">Save scanned receipt</button></article></section></main><div id="toast"></div><script src="app.js"></script></body></html>
