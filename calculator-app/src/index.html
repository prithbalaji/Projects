<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="calculator">
        <input id="display" class="display" value="0" readonly aria-label="Calculator display">

        <div class="buttons">
            <button type="button" class="action" data-action="clear">C</button>
            <button type="button" data-action="backspace">⌫</button>
            <button type="button" data-action="divide">÷</button>
            <button type="button" data-action="multiply">×</button>

            <button type="button" data-number="7">7</button>
            <button type="button" data-number="8">8</button>
            <button type="button" data-number="9">9</button>
            <button type="button" data-action="subtract">−</button>

            <button type="button" data-number="4">4</button>
            <button type="button" data-number="5">5</button>
            <button type="button" data-number="6">6</button>
            <button type="button" data-action="add">+</button>

            <button type="button" data-number="1">1</button>
            <button type="button" data-number="2">2</button>
            <button type="button" data-number="3">3</button>
            <button type="button" class="equals" data-action="equals">=</button>

            <button type="button" class="zero" data-number="0">0</button>
            <button type="button" data-number=".">.</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
