<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Expense Forecast</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">PERSONAL FINANCE</p><h1>Expense <span>Forecast</span></h1></div><button id="add">＋ Add expense</button></header><section class="summary"><article><p>Projected this month</p><strong id="projected">$0</strong><small id="trend">Based on 6 months</small></article><article><p>Budget remaining</p><strong id="remaining">$0</strong><small id="budgetStatus">Budget: $4,000</small></article><article><p>Highest category</p><strong id="highest">—</strong><small id="highestAmount">$0</small></article></section><section class="grid"><article class="card chart-card"><div class="card-head"><div><p class="eyebrow">SPENDING TREND</p><h2>Monthly forecast</h2></div><select id="horizon"><option value="3">Next 3 months</option><option value="6">Next 6 months</option></select></div><canvas id="chart"></canvas></article><article class="card"><p class="eyebrow">CATEGORIES</p><h2>Where it goes</h2><div id="categories"></div></article></section><section class="card"><div class="card-head"><div><p class="eyebrow">RECENT ACTIVITY</p><h2>Transactions</h2></div></div><div id="transactions"></div></section></main><dialog id="dialog"><form id="form"><h2>Add expense</h2><label>Name<input id="name" required placeholder="Electric bill"></label><div class="row"><label>Amount<input id="amount" type="number" required min="0" step=".01"></label><label>Category<select id="category"><option>Housing</option><option>Food</option><option>Transport</option><option>Shopping</option><option>Health</option><option>Other</option></select></label></div><button type="submit">Save expense</button></form></dialog><script src="app.js"></script></body></html>
